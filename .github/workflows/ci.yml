name: CI Compliance Pipeline

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]

jobs:
  compliance-test:
    name: Build & Verify RISC-V Compliance
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install System Dependencies & RISC-V Toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential gcc-riscv64-unknown-elf

      - name: Verify Cross-Compiler Version
        run: |
          riscv64-unknown-elf-gcc --version

      - name: Build RV32I Emulator
        run: |
          make clean
          make

      - name: Run Bare-Metal ELF MMIO Test
        run: |
          make test-elf

      - name: Run Official RV32UI Compliance Suite (42 Tests)
        run: |
          make test-compliance